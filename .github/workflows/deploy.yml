# Build the site and publish it to GitHub Pages on every push to main.
#
# `npm run verify` runs before anything is uploaded. While a legal text still
# has a [[DECIDE: ...]] marker, a page is missing, or a link is broken, it
# fails and nothing is published.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, and never cancel one half-way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # ships public/.nojekyll; v4 and later leave dotfiles out by default
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
